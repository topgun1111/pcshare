name: Universal Search - full component test

# Manual run (Actions > Universal Search - full component test > Run workflow) and on every push that touches search code.
on:
  workflow_dispatch:
  push:
    paths:
      - 'app/src/main/java/com/lanshare/app/core/usearch/**'
      - 'app/src/main/java/com/lanshare/app/core/office/**'
      - 'app/src/main/java/com/lanshare/app/core/UsSearch.kt'
      - 'app/src/main/java/com/lanshare/app/core/IndexManager.kt'
      - 'app/src/main/java/com/lanshare/app/UsActivity.kt'
      - 'app/src/main/assets/ui.html'
      - 'tools/usearch_selftest/**'
      - '.github/workflows/usearch-test.yml'

concurrency:
  group: usearch-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------ A. static checks of the Android glue (seconds)
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Static checks (files, routes, manifest, hooks, Cfg keys, ui.html JS, braces, no android.* in pure code)
        run: |
          bash tools/usearch_selftest/static_checks.sh | tee "$RUNNER_TEMP/static.log"
          n=$(grep -c '^ok' "$RUNNER_TEMP/static.log"); f=$(grep -c '^FAIL' "$RUNNER_TEMP/static.log")
          printf '### Static checks\n\nok **%s**, FAIL **%s**\n' "$n" "$f" >> "$GITHUB_STEP_SUMMARY"
          if [ "$f" -gt 0 ]; then { echo '```'; grep '^FAIL' "$RUNNER_TEMP/static.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: usearch-static-log, path: '${{ runner.temp }}/static.log' }

  # ------------------------------------------------------------------ B. compile the pure code ONCE, run the whole self-test in 4 environments
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Kotlin compiler 2.0.21
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kotlin.zip" https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Compile core/usearch + core/office + self-test (warnings are shown, errors fail)
        run: |
          mkdir -p out
          kotlinc app/src/main/java/com/lanshare/app/core/usearch/*.kt app/src/main/java/com/lanshare/app/core/office/*.kt tools/usearch_selftest/*.kt -include-runtime -d out/ust.jar 2>&1 | tee out/compile.log
          test "${PIPESTATUS[0]}" -eq 0
          printf '### Compile\n\nwarnings: **%s**\n' "$(grep -c 'warning:' out/compile.log || true)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: ust-jar, path: out/ust.jar }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: usearch-compile-log, path: out/compile.log, if-no-files-found: ignore }

  jvm:
    needs: compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: default,           opts: "",                                                   tz: UTC }
          - { name: turkish-locale,    opts: "-Duser.language=tr -Duser.country=TR",               tz: Europe/Istanbul }   # catches lowercase() / uppercase() locale bugs (dotless i)
          - { name: low-heap-256m,     opts: "-Xmx256m",                                           tz: UTC }                  # memory use of the index
          - { name: latin1-platform-charset,  opts: "-Dfile.encoding=ISO-8859-1 -Dsun.jnu.encoding=ISO-8859-1", tz: America/New_York }   # code that wrongly relies on the platform charset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/download-artifact@v4
        with: { name: ust-jar, path: out }
      - name: Run self-test (${{ matrix.name }})
        env: { TZ: '${{ matrix.tz }}' }
        run: |
          LOG="$RUNNER_TEMP/usearch-${{ matrix.name }}.log"
          java ${{ matrix.opts }} -jar out/ust.jar --report="$RUNNER_TEMP/report.md" < /dev/null > "$LOG" 2>&1 && rc=0 || rc=$?
          ok=$(grep -c -E '^ok ' "$LOG" || true); fl=$(grep -c '^FAIL' "$LOG" || true)
          {
            echo "### Self-test: ${{ matrix.name }}"
            echo; echo "exit code **$rc**, ok **$ok**, FAIL **$fl**"; echo
            cat "$RUNNER_TEMP/report.md" 2>/dev/null || echo "(no per-component report: the run crashed before the end)"
            echo; echo '<details><summary>Measurements (info lines)</summary>'; echo; echo '```'; grep '^info' "$LOG" || true; echo '```'; echo '</details>'
            if [ "$fl" -gt 0 ] || [ "$rc" -ne 0 ]; then echo; echo '**First problems**'; echo '```'; { grep -m15 -E '^FAIL|Exception|Error' "$LOG" || true; }; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          grep '^SECTION' "$LOG" || true
          echo "rc=$rc ok=$ok FAIL=$fl"
          if [ "$rc" -ne 0 ] || [ "$fl" -gt 0 ] || [ "$ok" -lt 480 ]; then
            echo "::error title=Search self-test (${{ matrix.name }}) failed::rc=$rc ok=$ok FAIL=$fl. $({ grep -m3 -E '^FAIL|Exception' "$LOG" || true; } | tr '\n' ' ' | cut -c1-350)"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'usearch-log-${{ matrix.name }}', path: '${{ runner.temp }}/usearch-${{ matrix.name }}.log' }

  # ------------------------------------------------------------------ C. determinism: two runs give the same ok / FAIL lines (no test depends on time, order or luck)
  determinism:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/download-artifact@v4
        with: { name: ust-jar, path: out }
      - name: Run twice and compare
        run: |
          for i in 1 2; do java -jar out/ust.jar < /dev/null 2>&1 | grep -E '^(ok|FAIL)' | sed -E 's/[0-9]+ ?ms//g' | sort > "$RUNNER_TEMP/run$i.txt" || true; done
          if diff -q "$RUNNER_TEMP/run1.txt" "$RUNNER_TEMP/run2.txt" >/dev/null; then echo "identical: $(wc -l < "$RUNNER_TEMP/run1.txt") lines"; printf '### Determinism\n\nidentical (%s lines)\n' "$(wc -l < "$RUNNER_TEMP/run1.txt")" >> "$GITHUB_STEP_SUMMARY"
          else diff "$RUNNER_TEMP/run1.txt" "$RUNNER_TEMP/run2.txt" | head -20; echo "::error title=Self-test is not deterministic::two runs differ"; exit 1; fi

  # ------------------------------------------------------------------ D. the Android code of the search really compiles (needs the Android SDK; same setup as the APK build)
  android-compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Compile all Kotlin (debug) - catches every error in UsActivity, UsSearch, IndexManager, Routes, Shortcuts ...
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:compileDebugKotlin 2>&1 | tee "$RUNNER_TEMP/android-compile.log"
          rc=${PIPESTATUS[0]}
          { echo '### Android compile'; echo; echo "exit code **$rc**, errors **$(grep -c '^e: ' "$RUNNER_TEMP/android-compile.log" || true)**"; if [ "$rc" -ne 0 ]; then echo '```'; grep -m25 '^e: ' "$RUNNER_TEMP/android-compile.log"; echo '```'; fi; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$rc" -ne 0 ]; then echo "::error title=Android compile failed::$({ grep -m3 '^e: ' "$RUNNER_TEMP/android-compile.log" || true; } | tr '\n' ' ' | cut -c1-350)"; fi
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-compile-log, path: '${{ runner.temp }}/android-compile.log' }
