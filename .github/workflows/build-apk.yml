name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # commit sayısı için tam geçmiş şart
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android lisansları
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }

      - name: Sürüm
        id: ver
        run: |
          # VERSION = major (2). Next version = highest existing v<major>.<n> tag + 1; first one is v<major>.0
          MAJOR=$(tr -d '[:space:]' < VERSION 2>/dev/null || echo 2)
          MAJOR=${MAJOR%%.*}
          git fetch --tags --force -q || true
          LAST=$(git tag -l "v${MAJOR}.*" | sed -E "s/^v${MAJOR}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)
          if [ -z "$LAST" ]; then MINOR=0; else MINOR=$((LAST+1)); fi
          VER="$MAJOR.$MINOR"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "apk=LANShare-v$VER.apk" >> "$GITHUB_OUTPUT"

      # Secret keystore only when ALL four secrets exist; otherwise the build signs with app/lanshare.jks
      - name: İmza hazırlığı
        env:
          KS: ${{ secrets.KEYSTORE_B64 || secrets.KEYSTORE_FILE }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KKP: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KP" ] && [ -n "$KA" ] && [ -n "$KKP" ] && echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Keystore secrets incomplete/invalid - signing with app/lanshare.jks"
          fi

      - name: Release APK
        env:
          APP_VERSION: ${{ steps.ver.outputs.ver }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          gradle --no-daemon --stacktrace -PappVersion="$APP_VERSION" :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # Surface the real error in the Annotations list (readable on a phone)
            grep -E '^e: ' "$RUNNER_TEMP/build.log" | head -8 | while IFS= read -r l; do echo "::error::$l"; done
            grep -A4 'What went wrong' "$RUNNER_TEMP/build.log" | head -6 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $rc

      - name: Sürümü doğrula
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT2" ]; then echo "::warning::aapt2 yok, sürüm doğrulaması atlandı"; exit 0; fi
          WANT="${{ steps.ver.outputs.ver }}"
          GOT=$("$AAPT2" dump badging app/build/outputs/apk/release/*.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          echo "APK versionName: $GOT (beklenen: $WANT)"
          case "$GOT" in
            "$WANT"|"$WANT"-*) ;;
            *) echo "::error::APK versionName '$GOT' but release is '$WANT' - app/build.gradle.kts is missing the appVersion line?"; exit 1 ;;
          esac

      - name: APK adlandır
        run: cp app/build/outputs/apk/release/*.apk "${{ steps.ver.outputs.apk }}"

      - uses: actions/upload-artifact@v4
        with:
          name: LANShare-apk
          path: ${{ steps.ver.outputs.apk }}

      # Release kalıcıdır (artifact 90 günde silinir)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: LANShare ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          files: ${{ steps.ver.outputs.apk }}

  # Office core self-tests on the JVM (Parts 3-12). Separate job: it never blocks the APK build / release above,
  # but a red mark here means a self-test printed FAIL or crashed. Log is attached as an artifact.
  office-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Kotlin compiler 2.0.21
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kotlin.zip" https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q "$RUNNER_TEMP/kotlin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/kotlinc/bin" >> "$GITHUB_PATH"
      - name: Compile core/office + self-test
        run: |
          kotlinc app/src/main/java/com/lanshare/app/core/office/*.kt tools/office_selftest/Main.kt -include-runtime -d "$RUNNER_TEMP/ost.jar" 2>&1 | tee "$RUNNER_TEMP/compile.log"
          test "${PIPESTATUS[0]}" -eq 0
      - name: Run self-tests
        run: |
          D=tools/office_selftest
          LOG="$RUNNER_TEMP/selftest.log"; : > "$LOG"
          SUM="${GITHUB_STEP_SUMMARY:-/dev/null}"
          printf '| self-test | ok | FAIL | minimum ok | result |\n|---|---|---|---|---|\n' >> "$SUM"
          bad=0
          # "arguments|minimum number of ok lines" (about 80% of the counts measured in earlier sessions; a quiet early exit gives 0 and fails)
          while IFS='|' read -r t min; do
            echo "=== selftest [$t] ===" >> "$LOG"
            java -jar "$RUNNER_TEMP/ost.jar" $t > "$RUNNER_TEMP/one.log" 2>&1; rc=$?
            cat "$RUNNER_TEMP/one.log" >> "$LOG"
            ok=$(grep -c -E '^(ok|OK) ' "$RUNNER_TEMP/one.log"); fl=$(grep -c '^FAIL' "$RUNNER_TEMP/one.log")
            res=PASS
            if [ "$rc" -ne 0 ]; then res="CRASH (exit $rc)"; fi
            if [ "$fl" -gt 0 ]; then res="FAIL"; fi
            if [ "$ok" -lt "$min" ] && [ "$res" = PASS ]; then res="TOO FEW ok"; fi
            echo "[${t:-default}] ok=$ok FAIL=$fl min=$min -> $res"
            echo "| ${t:-default} | $ok | $fl | $min | $res |" >> "$SUM"
            if [ "$res" != PASS ]; then
              bad=1
              echo "::error title=Self-test [${t:-default}] $res::ok=$ok FAIL=$fl min=$min. $(grep -m3 -E '^FAIL|Exception' "$RUNNER_TEMP/one.log" | tr '\n' ' ' | cut -c1-350)"
            fi
          done <<EOF
          |20
          --docx|8
          --edit|6
          --fonts $D app/src/main/assets/fonts/office|15
          --sections $D|34
          --printtest $D|8
          --float $D|15
          --styles $D|35
          --review $D|19
          --cf $D|42
          --chart $D|35
          --chart2 $D|20
          --nav $D|4
          EOF
          exit $bad
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: office-selftest-log
          path: |
            ${{ runner.temp }}/selftest.log
            ${{ runner.temp }}/compile.log
          if-no-files-found: ignore
