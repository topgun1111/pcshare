name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Settings export / import: the format + compatibility gate (core/settings/SettingsSchema.kt) runs on a plain JVM, no Android needed.
  settings-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Settings selftest
        run: |
          mkdir -p /tmp/st && cd /tmp/st
          curl -sSL -o kotlin.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip && unzip -q kotlin.zip
          curl -sSL -o orgjson.jar https://repo1.maven.org/maven2/org/json/json/20240303/json-20240303.jar
          /tmp/st/kotlinc/bin/kotlinc "$GITHUB_WORKSPACE/app/src/main/java/com/lanshare/app/core/settings/SettingsSchema.kt" "$GITHUB_WORKSPACE/tools/settings_selftest/SettingsSelfTest.kt" -cp orgjson.jar -include-runtime -d st.jar
          java -cp st.jar:orgjson.jar SettingsSelfTestKt

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # commit sayısı için tam geçmiş şart
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android lisansları
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }

      - name: Sürüm
        id: ver
        run: |
          # VERSION = major (2). Next version = highest existing v<major>.<n> tag + 1; first one is v<major>.0
          MAJOR=$(tr -d '[:space:]' < VERSION 2>/dev/null || echo 2)
          MAJOR=${MAJOR%%.*}
          git fetch --tags --force -q || true
          LAST=$(git tag -l "v${MAJOR}.*" | sed -E "s/^v${MAJOR}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)
          if [ -z "$LAST" ]; then MINOR=0; else MINOR=$((LAST+1)); fi
          VER="$MAJOR.$MINOR"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "apk=LANShare-v$VER.apk" >> "$GITHUB_OUTPUT"

      # Secret keystore only when ALL four secrets exist; otherwise the build signs with app/lanshare.jks
      - name: İmza hazırlığı
        env:
          KS: ${{ secrets.KEYSTORE_B64 || secrets.KEYSTORE_FILE }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KKP: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KP" ] && [ -n "$KA" ] && [ -n "$KKP" ] && echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Keystore secrets incomplete/invalid - signing with app/lanshare.jks"
          fi

      - name: Release APK
        env:
          APP_VERSION: ${{ steps.ver.outputs.ver }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          gradle --no-daemon --stacktrace -PappVersion="$APP_VERSION" :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # Surface the real error in the Annotations list (readable on a phone)
            grep -E '^e: ' "$RUNNER_TEMP/build.log" | head -8 | while IFS= read -r l; do echo "::error::$l"; done
            grep -A4 'What went wrong' "$RUNNER_TEMP/build.log" | head -6 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $rc

      - name: Sürümü doğrula
        run: |
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          if [ -z "$AAPT2" ]; then echo "::warning::aapt2 yok, sürüm doğrulaması atlandı"; exit 0; fi
          WANT="${{ steps.ver.outputs.ver }}"
          GOT=$("$AAPT2" dump badging app/build/outputs/apk/release/*.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
          echo "APK versionName: $GOT (beklenen: $WANT)"
          case "$GOT" in
            "$WANT"|"$WANT"-*) ;;
            *) echo "::error::APK versionName '$GOT' but release is '$WANT' - app/build.gradle.kts is missing the appVersion line?"; exit 1 ;;
          esac

      - name: APK adlandır
        run: cp app/build/outputs/apk/release/*.apk "${{ steps.ver.outputs.apk }}"

      - uses: actions/upload-artifact@v4
        with:
          name: LANShare-apk
          path: ${{ steps.ver.outputs.apk }}

      # Release notes = TOP "## " section of CHANGELOG.md (shown by the app's update dialog before the download button).
      # Same text as the previous release (nobody added a new section) or no bullets = "not listed", never old notes twice.
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## /{ if(f) exit; f=1; next } f' CHANGELOG.md 2>/dev/null | sed '/^<!--.*-->$/d' > release-notes.md || true
          if ! grep -q '^[-*] ' release-notes.md; then
            echo "::warning::CHANGELOG.md has no new section with '- ' entries at the top - update dialog will say 'not listed' (HANDOVER.md, READ FIRST rule 3)."
            echo "Changes not listed for this build." > release-notes.md
          else
            PREV=$(gh release view --json body -q .body 2>/dev/null || true)
            if [ "$(printf '%s' "$PREV" | tr -d '\r')" = "$(tr -d '\r' < release-notes.md)" ]; then
              echo "::warning::CHANGELOG.md top section is identical to the previous release - add a NEW section for this change."
              echo "Changes not listed for this build." > release-notes.md
            fi
          fi
          cat release-notes.md

      # Release kalıcıdır (artifact 90 günde silinir)
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          tag_name: ${{ steps.ver.outputs.tag }}
          name: LANShare ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          files: ${{ steps.ver.outputs.apk }}
