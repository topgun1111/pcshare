name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Job 1: version + shared versionCode (one value for both editions)
  prep:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
      tag: ${{ steps.ver.outputs.tag }}
      code: ${{ steps.ver.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Sürüm
        id: ver
        run: |
          # VERSION = major (2). Next version = highest existing v<major>.<n> tag + 1; first one is v<major>.0
          MAJOR=$(tr -d '[:space:]' < VERSION 2>/dev/null || echo 2)
          MAJOR=${MAJOR%%.*}
          git fetch --tags --force -q || true
          LAST=$(git tag -l "v${MAJOR}.*" | sed -E "s/^v${MAJOR}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1)
          if [ -z "$LAST" ]; then MINOR=0; else MINOR=$((LAST+1)); fi
          VER="$MAJOR.$MINOR"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "code=$(( ($(date -u +%s) - 1767225600) / 60 ))" >> "$GITHUB_OUTPUT"

  # Jobs 2 + 3: full and lite build IN PARALLEL on two runners (matrix)
  build:
    needs: prep
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        edition: [full, lite]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # commit sayısı için tam geçmiş şart
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android lisansları
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }

      # Secret keystore only when ALL four secrets exist; otherwise the build signs with app/lanshare.jks
      - name: İmza hazırlığı
        env:
          KS: ${{ secrets.KEYSTORE_B64 || secrets.KEYSTORE_FILE }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KKP: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KS" ] && [ -n "$KP" ] && [ -n "$KA" ] && [ -n "$KKP" ] && echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks" 2>/dev/null; then
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Keystore secrets incomplete/invalid - signing with app/lanshare.jks"
          fi

      - name: Release APK (${{ matrix.edition }})
        env:
          EDITION: ${{ matrix.edition }}
          APP_VERSION: ${{ needs.prep.outputs.ver }}
          VERSION_CODE: ${{ needs.prep.outputs.code }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          if [ "$EDITION" = lite ]; then OUT="LANShare-v$APP_VERSION-lite.apk"; else OUT="LANShare-v$APP_VERSION.apk"; fi
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          gradle --no-daemon --stacktrace -PappVersion="$APP_VERSION" -Pedition="$EDITION" :app:assembleRelease 2>&1 | tee "$RUNNER_TEMP/build.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            # Surface the real error in the Annotations list (readable on a phone)
            grep -E '^e: ' "$RUNNER_TEMP/build.log" | head -8 | while IFS= read -r l; do echo "::error::[$EDITION] $l"; done
            grep -A4 'What went wrong' "$RUNNER_TEMP/build.log" | head -6 | while IFS= read -r l; do echo "::error::[$EDITION] $l"; done
            exit $rc
          fi
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 2>/dev/null | sort -V | tail -1)
          if [ -n "$AAPT2" ]; then
            GOT=$("$AAPT2" dump badging app/build/outputs/apk/release/*.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -1)
            echo "[$EDITION] APK versionName: $GOT (beklenen: $APP_VERSION)"
            case "$GOT" in
              "$APP_VERSION"|"$APP_VERSION"-*) ;;
              *) echo "::error::[$EDITION] APK versionName '$GOT' but release is '$APP_VERSION' - app/build.gradle.kts is missing the appVersion line?"; exit 1 ;;
            esac
          else
            echo "::warning::aapt2 yok, sürüm doğrulaması atlandı"
          fi
          cp app/build/outputs/apk/release/*.apk "$OUT"
          if [ "$EDITION" = lite ] && unzip -l "$OUT" | grep -qE 'assets/fonts/(office/|ff_)'; then
            echo "::error::lite APK still contains the bundled fonts (liteExclude in app/build.gradle.kts did not apply)"; exit 1
          fi
          if [ "$EDITION" = lite ] && unzip -l "$OUT" | grep -q 'libonnxruntime'; then
            echo "::error::lite APK still contains the ONNX runtime (compileOnly in app/build.gradle.kts did not apply)"; exit 1
          fi
          echo "- $EDITION: $(( $(stat -c %s "$OUT") / 1048576 )) MB ($OUT)" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: LANShare-apk-${{ matrix.edition }}
          path: ${{ env.OUT }}
          if-no-files-found: error

  # Job 4: publishes ONE release carrying both APKs, only when both builds succeeded
  release:
    needs: [prep, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: LANShare-apk-*
          merge-multiple: true
          path: apks

      # Release notes = TOP "## " section of CHANGELOG.md (shown by the app's update dialog before the download button).
      # Same text as the previous release (nobody added a new section) or no bullets = "not listed", never old notes twice.
      - name: Release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## /{ if(f) exit; f=1; next } f' CHANGELOG.md 2>/dev/null | sed '/^<!--.*-->$/d' > release-notes.md || true
          if ! grep -q '^[-*] ' release-notes.md; then
            echo "::warning::CHANGELOG.md has no new section with '- ' entries at the top - update dialog will say 'not listed' (HANDOVER.md, READ FIRST rule 3)."
            echo "Changes not listed for this build." > release-notes.md
          else
            PREV=$(gh release view --json body -q .body 2>/dev/null || true)
            if [ "$(printf '%s' "$PREV" | tr -d '\r')" = "$(tr -d '\r' < release-notes.md)" ]; then
              echo "::warning::CHANGELOG.md top section is identical to the previous release - add a NEW section for this change."
              echo "Changes not listed for this build." > release-notes.md
            fi
          fi
          cat release-notes.md
          ls -l apks

      # Release kalıcıdır (artifact 90 günde silinir)
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          tag_name: ${{ needs.prep.outputs.tag }}
          name: LANShare ${{ needs.prep.outputs.tag }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            apks/LANShare-v${{ needs.prep.outputs.ver }}.apk
            apks/LANShare-v${{ needs.prep.outputs.ver }}-lite.apk
