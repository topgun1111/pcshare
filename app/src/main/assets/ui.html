*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
svg{width:24px;height:24px;fill:currentColor;flex:none;display:block}
button,input,select,textarea{font-family:inherit;font-weight:inherit}
body{margin:0;font:500 15px/1.4 'Urbanist LS','Segoe UI','Segoe UI Variable Text',Selawik,Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--fg);padding-bottom:calc(var(--dockh,0px) + 110px);overscroll-behavior-y:contain}
/* pull to refresh */
#ptr{position:fixed;left:0;right:0;top:0;height:0;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;z-index:4;font-size:13px;pointer-events:none}
#ptr div{margin:0 0 8px;padding:6px 14px;border-radius:16px;background:var(--cont);color:var(--mut);box-shadow:var(--sh)}#ptr.go div{color:var(--ac);font-weight:700}
/* top app bar */
#top{position:sticky;top:0;z-index:5;background:var(--bg);transition:box-shadow .2s}
#top:before{content:"";display:block;height:env(safe-area-inset-top);background:var(--bar)}
#top.el{box-shadow:0 2px 6px #0004}
#pathrow{display:flex;align-items:center;gap:8px;padding:2px 8px 2px 4px;background:var(--card);border-bottom:1px solid var(--bd)}
.pill{display:none;align-items:center;gap:6px;flex:none;height:32px;padding:0 10px;border:1px solid var(--mut);border-radius:16px;font-weight:700;font-size:13px;letter-spacing:.2px;text-transform:uppercase}
.pill i{width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--fg) var(--p,0%),var(--bd) 0)}
.bar{display:flex;align-items:center;gap:0;height:52px;padding:0 2px 0 14px;background:var(--bar);color:var(--onbar)}
.selb{display:none;padding-left:4px;background:var(--sel);color:var(--onsel)}
body.selm .mainb{display:none}body.selm .selb{display:flex}
.ttl{flex:1;min-width:0;display:flex;align-items:center;gap:10px}.bar .ibtn{width:48px;height:48px}.bar .ibtn svg{width:30px;height:30px}
.ttl h1{flex:0 1 auto;min-width:0;font-size:18px;line-height:24px;font-weight:600;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nm{display:none!important;align-items:center;gap:4px;color:var(--barmut);font-size:12px;line-height:16px;flex:0 1 auto;min-width:0;max-width:50%}
#nm svg{width:12px;height:12px}#nmt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;transition:background .15s}
.ibtn:active,.ibtn.spin:active{background:var(--hov)}
.ibtn.spin svg{animation:rot .8s linear}
@keyframes rot{to{transform:rotate(360deg)}}
.selb h2{flex:1;font-size:20px;font-weight:600;margin:0 0 0 4px}
/* device chips */
#peers{display:flex;gap:8px;overflow-x:auto;padding:5px 10px;scrollbar-width:none;background:var(--bg);border-bottom:1px solid var(--bd)}#peers::-webkit-scrollbar{display:none}
.chip{flex:none;height:28px;display:flex;align-items:center;gap:8px;border:1px solid var(--bd);background:var(--card);border-radius:14px;padding:0 12px 0 8px;font-size:13px;font-weight:600;transition:background .15s}
.chip:active{background:var(--hov)}
.chip svg{width:18px;height:18px}
.chip.on{background:var(--sel);color:var(--onsel);border-color:transparent}
.chip.add{color:var(--ac);border-style:dashed}
#peers{gap:8px;padding:6px 12px}
#peers .chip{height:38px;gap:8px;padding:0 15px 0 12px;border-radius:19px;font-size:14px;font-weight:600}
#peers .chip svg{width:20px;height:20px}
#peers .chip .dot{width:10px;height:10px;margin:0 3px}
#peers .chip small{font-size:11px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);margin:0 3px}.dot.wn{background:var(--warn)}
#hint{padding:3px 14px;color:var(--mut);font-size:12px;background:var(--bg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#hint:empty{display:none}
/* breadcrumbs */
#crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:0;overflow-x:auto;white-space:nowrap;scrollbar-width:none;color:var(--mut)}#crumbs::-webkit-scrollbar{display:none}
.crumb{flex:none;display:flex;align-items:center;gap:6px;height:40px;padding:0 5px;border-radius:6px;font-size:16px;color:var(--mut);transition:background .15s}
.crumb:active{background:var(--hov)}.crumb svg{width:18px;height:18px}.crumb svg.cico{width:28px;height:28px}#crumbs>.crumb:first-child svg.cico{width:36px;height:36px}
.crumb.cur{color:var(--fg);font-weight:700}

.di.mm{min-height:76px;gap:14px}.di.mm .dl{width:44px;height:44px}.di.mm .dl svg{width:44px;height:44px}.di.mm .dt b{font-size:23px;font-weight:600}.di.mm .dt small{font-size:15px}
.di.add .dt b{color:var(--ac)}.di.dis{opacity:.45}
.dnone{padding:40px 24px;text-align:center;color:var(--mut);font-size:14px}
.ddot{width:12px;height:12px;border-radius:50%;background:var(--ok);margin:0 12px}.ddot.wn{background:var(--warn,#e0a100)}
#dfoot{flex:none;border-top:1px solid var(--bd);display:flex;background:var(--bg)}
#dfoot button{flex:1;height:52px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--ac)}
#dfoot button:active{background:var(--hov)}#dfoot svg{width:20px;height:20px}
#dedge{position:fixed;left:0;top:96px;bottom:120px;width:14px;z-index:5}
body.dual #dedge,body.selm #dedge{display:none}
/* start menu (home): Material 3 look built on the app's own theme tokens; spec history in HANDOVER_HOME_MENU.md */
#home{display:none;position:fixed;inset:0;z-index:8;flex-direction:column;background:var(--bg);color:var(--fg);--hc1:#8e24aa;--hc2:#d81b60;--hc3:#b7791f;--hc4:#546e7a;--hc5:#757575;--hc6:#00897b;--hc7:#f9a825}
:root[data-theme=dark] #home{--hc1:#ce93d8;--hc2:#f48fb1;--hc3:#ffcc80;--hc4:#b0bec5;--hc5:#bdbdbd;--hc6:#80cbc4;--hc7:#ffe082}
@media(prefers-color-scheme:dark){:root[data-theme=auto] #home{--hc1:#ce93d8;--hc2:#f48fb1;--hc3:#ffcc80;--hc4:#b0bec5;--hc5:#bdbdbd;--hc6:#80cbc4;--hc7:#ffe082}}
#home .hb{flex:none;height:calc(64px + env(safe-area-inset-top));padding:env(safe-area-inset-top) 4px 0;display:flex;align-items:center;gap:4px;background:var(--bg)}
#home .hb h1{flex:1;margin:0 0 0 8px;font-size:22px;font-weight:500}
#home .hb button{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mut)}
#home .hb button:active{background:var(--hov)}
#home .hb svg{width:24px;height:24px}
#home .hbd{flex:1;overflow-y:auto;padding:8px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:20px;-webkit-overflow-scrolling:touch}
#home .hero{flex:none;background:var(--sel);color:var(--onsel);border-radius:28px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;cursor:pointer;animation:hmin .4s cubic-bezier(.2,.8,.25,1) both;-webkit-tap-highlight-color:transparent}
#home .hero:active{filter:brightness(.96)}
#home .hero .top{display:flex;align-items:center;gap:14px}
#home .hero .ic{flex:none;width:52px;height:52px;border-radius:16px;background:var(--ac);color:var(--onac);display:flex;align-items:center;justify-content:center}
#home .hero .ic svg{width:28px;height:28px;fill:currentColor}
#home .hero b{display:block;font-size:18px;font-weight:500}
#home .hero small{font-size:13px;opacity:.8}
#home .meter{height:8px;border-radius:4px;background:color-mix(in srgb,var(--onsel) 18%,transparent);overflow:hidden}
#home .meter i{display:block;height:100%;width:0;border-radius:4px;background:var(--ac);transition:width .5s ease}
#home .hero .row{display:flex;justify-content:space-between;font-size:12px;font-variant-numeric:tabular-nums;min-height:15px}
#home .sec{flex:none;font-size:14px;font-weight:500;color:var(--mut);padding-left:4px;margin-bottom:-8px}
#home .hg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:none}
#home .ht{background:var(--cont);border-radius:24px;padding:14px 6px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0;cursor:pointer;animation:hmin .4s cubic-bezier(.2,.8,.25,1) both;animation-delay:calc(var(--i,0)*50ms);transition:transform .12s;-webkit-tap-highlight-color:transparent}
#home .ht:active{transform:scale(.96);background:var(--hov)}
#home .ht .tb{width:56px;height:56px;border-radius:18px;background:color-mix(in srgb,var(--c) 20%,var(--cont));color:var(--c);display:flex;align-items:center;justify-content:center}
#home .ht .tb svg{width:28px;height:28px;fill:currentColor}
#home .ht .tt{font-size:13px;font-weight:500;text-align:center;line-height:1.2}
#home .ht .ts{font-size:11px;color:var(--mut);text-align:center;line-height:1.2}
#home .ht.off{opacity:.5;pointer-events:none}
#hmfavs{position:fixed;inset:0;z-index:20}
#hmfav{position:fixed;z-index:21;overflow-y:auto;background:var(--card);color:var(--fg);border:1px solid var(--bd);border-radius:20px;box-shadow:0 8px 28px #0006;padding:6px 0;animation:hmpop .16s ease-out both;-webkit-overflow-scrolling:touch}
#hmfav .mh{padding:10px 18px 6px;font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--mut)}
#hmfav .mn{padding:10px 18px 14px;font-size:14px;color:var(--mut);white-space:pre-line}
#hmfav .mi{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:6px 16px;text-align:left;border-bottom:1px solid var(--bd)}
#hmfav .mi:last-child{border-bottom:0}
#hmfav .mi:active{background:var(--hov)}
#hmfav .ml{flex:none;width:36px;height:36px;display:grid;place-items:center}
#hmfav .mt{flex:1;min-width:0;display:flex;flex-direction:column}
#hmfav .mt b{font-weight:500;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hmfav .mt small{font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes hmpop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
@keyframes hmin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#home .ht,#home .hero{animation:none}}

  if(!inArc()){if(arcShown){arcShown=false;$('#toast').style.display='none'}return}
  if(arcBusy||trk>0)return;arcBusy=true;
  try{const r=await api('GET','/api/arcjob',null,3000);
    if(r&&r.id){curJob=r.id;arcShown=true;const pct=Math.min(99,Math.floor(r.done*100/Math.max(r.total,1)));
      toast((r.label||'Opening archive')+'\u2026 '+pct+'%  '+fmt(r.done)+' / '+fmt(r.total),0,pct)}
    else if(arcShown){arcShown=false;$('#toast').style.display='none'}
  }catch(e){}
  arcBusy=false},600);
async function doZip(){   // pack the selected files / folders into a new .zip next to them (on whichever device is open)
  const it=selItems();if(!it.length||inArc())return;
  const base=it.length===1?(it[0].dir?(it[0].disp||it[0].name):it[0].name.replace(/\.[^.\/]+$/,'')):(S.path.split('/').filter(Boolean).pop()||'Archive');
  const n=await dlg({title:'Create ZIP',msg:it.length+' item'+(it.length>1?'s':'')+' will be packed into a new .zip in this folder',input:{value:base,label:'File name'},ok:'Zip'});
  if(!n||!n.trim())return;
  const paths=selPaths(),zdir=it[0].disp?(paths[0].replace(/\/[^\/]*$/,'')||'/'):S.path;S.sel.clear();GALT=0;render();
  let rep=false;   // same name already in the folder: ask instead of silently making "name (1).zip"
  try{const zn=/\.zip$/i.test(n.trim())?n.trim():n.trim()+'.zip',ls=await api('GET','/api/ls?dev='+enc(S.dev)+'&path='+enc(zdir));
    if((ls.items||[]).some(i=>i.name===zn)){const a=await dlg({title:'"'+zn+'" already exists',msg:'Replace it with the new ZIP? The old file is only replaced once the new one is complete.',ok:'Replace',alt:'Keep both',danger:true});
      if(!a){S.sel.clear();render();return}rep=a===true}}catch(e){}
  try{const r=await api('POST','/api/zip',{dev:S.dev,paths,dir:zdir,name:n.trim(),replace:rep});watchJob(r.job);await track(r.job)}catch(e){toast('\u26a0 '+e.message,6000)}}
/* Extract: folder picker sheet. Starts at [start]; tap a folder to open it, back row goes up, "Extract here" confirms. Resolves the chosen folder path or null. */
function pickExtractDir(start,title,okLbl,dev){return new Promise(res=>{
  const o=$('#sheet');o.style.display='flex';let cur=start||'/',tk=0;dev=dev||S.dev;
  const fin=v=>{o.style.display='none';o.onclick=null;res(v)};o.onclick=e=>{if(e.target===o)fin(null)};
  const draw=async(p)=>{const my=++tk;let items=[],err='';
    try{const r=await api('GET','/api/ls?dev='+enc(dev)+'&path='+enc(p));if(my!==tk)return;p=r.path||p;items=(r.items||[]).filter(i=>i.dir&&(S.hid||(i.name[0]!=='.'&&!i.hid)))}catch(e){if(my!==tk)return;err=e.message}
    cur=p;o.textContent='';const card=E('div','card');card.append(E('div','handle'),E('h3','',title||'Extract to\u2026'));
    const loc=E('small','',p);loc.style.cssText='color:var(--mut);margin:-4px 0 6px;word-break:break-all';card.append(loc);
    if(p!=='/'){const b=E('button','li'),ld=E('div','lead'),lt=E('div','lt');ld.append(ic('back'));lt.append(E('span','','..'));b.append(ld,lt);b.onclick=()=>draw(pdir(p));card.append(b)}
    if(err)card.append(E('p','','\u26a0 '+err));
    else if(!items.length)card.append(E('p','','No sub-folders here.'));
    items.forEach(i=>{const b=E('button','li'),ld=E('div','lead'),lt=E('div','lt');ld.append(ic('folder'));lt.append(E('span','',i.name));b.append(ld,lt);b.onclick=()=>draw(jn(p,i.name));card.append(b)});
    const row=E('div','');row.style.cssText='display:flex;justify-content:flex-end;gap:8px;margin-top:8px;position:sticky;bottom:0;background:var(--cont);padding-top:4px';
    const c=E('button','tbtn','Cancel');c.onclick=()=>fin(null);const ok=E('button','tbtn fill',okLbl||'Extract here');ok.onclick=()=>fin(cur);row.append(c,ok);card.append(row);o.append(card)};
  draw(cur)})}
/* Name clash at the destination: Ask for each file / Replace all / Skip existing. Resolves 'ask' | 'replace' | 'rename' | 'skip', or null when cancelled ('rename' without asking when nothing clashes). Items that already sit in [dir] on the same device are left out (copying onto itself keeps both). */
const cdest=p=>{let b=p.split('/').filter(Boolean).pop()||'';if(b.endsWith('!')){b=b.slice(0,-1);const i=b.lastIndexOf('.');if(i>0)b=b.slice(0,i)}return b};
async function askConflicts(dev,dir,paths,srcDev){
  let have;try{const r=await api('GET','/api/ls?dev='+enc(dev)+'&path='+enc(dir));have=new Set((r.items||[]).map(i=>i.name))}catch(e){return 'rename'}
  const hit=[...new Set(paths.filter(p=>!(srcDev===dev&&pdir(p)===dir)).map(cdest).filter(n=>n&&have.has(n)))];
  if(!hit.length)return 'rename';
  return new Promise(res=>{
    const o=$('#sheet');o.textContent='';o.style.display='flex';const card=E('div','card');
    card.append(E('div','handle'),E('h3','',hit.length===1?'Already exists':hit.length+' items already exist'));
    const t=E('p','',hit.slice(0,3).join(', ')+(hit.length>3?' and '+(hit.length-3)+' more':'')+' already in this folder. Folders are merged - nothing that is already there gets deleted. What should happen to files with the same name?');t.style.cssText='margin:0 0 8px;color:var(--mut);word-break:break-word';card.append(t);
    const fin=v=>{o.style.display='none';o.onclick=null;res(v)};o.onclick=e=>{if(e.target===o)fin(null)};
    [['Ask for each file','ask','tbtn fill'],['Replace all','replace','tbtn'],['Skip existing','skip','tbtn'],['Cancel',null,'tbtn']].forEach(a=>{const b=E('button',a[2],a[0]);b.style.alignSelf='stretch';b.onclick=()=>fin(a[1]);card.append(b)});
    o.append(card)})}
async function doExtract(m){  // 0: archives selected in a folder, 1: items selected inside an archive, 2: the whole open archive
  let paths,dir;
  if(inArc()){const ar=arcRoot();dir=pdir(ar.slice(0,-1));paths=m===2?[ar]:selPaths()}
  else{dir=S.path;paths=selItems().filter(isArcF).map(i=>jn(S.path,i.name))}
  if(!paths.length)return;
  const to=await pickExtractDir(dir);if(!to)return;dir=to;   // ask where to extract (starts in the archive's own folder)
  const cf=await askConflicts(S.dev,dir,paths,S.dev);if(!cf)return;   // same name already there: replace / keep both / skip
  const inside=inArc();S.sel.clear();render();
  try{const r=await api('POST','/api/extract',{dev:S.dev,paths,dir,conflict:cf});watchJob(r.job);
    if(await track(r.job)&&!inside)load()}catch(e){toast('\u26a0 '+e.message,5000)}}
function doNew(){
  if(!(window.LSAndroid&&LSAndroid.editText))return doMkdir();
  const o=$('#sheet');o.textContent='';o.style.display='flex';const card=E('div','card');card.append(E('div','handle'),E('h3','','Create new'));
  const fin=f=>{o.style.display='none';o.onclick=null;if(f)f()};o.onclick=e=>{if(e.target===o)fin()};
  const opt=(k,t,f)=>{const b=E('button','li'),ld=E('div','lead'),lt=E('div','lt');ld.append(ic(k));lt.append(E('span','',t));b.append(ld,lt);b.onclick=()=>fin(f);card.append(b)};
  opt('newfolder','Folder',doMkdir);opt('doc','Text note',doNewNote);
  const c=E('button','tbtn','Cancel');c.style.alignSelf='flex-end';c.onclick=()=>fin();card.append(c);o.append(card)}
$('#fab').onclick=()=>inArc()?doExtract(2):doNew();

window.lsPane={get dev(){return S.dev},get path(){return S.path},paths:()=>selPaths(),

if(KID){document.body.classList.add('kid');$('#dualb').textContent='';$('#dualb').append(ic('single'));

else $('#dualb').onclick=()=>lsDualSet(true);
function lsDualSet(on){SV('ls_dual',on?'1':'0');duApply()}
function lsFocus(n){if(!DU||DU.act===n)return;DU.act=n;DU.wa.classList.toggle('act',n===1);DU.wb.classList.toggle('act',n===2);
  try{(n===1?DU.a:DU.b).contentWindow.lsPane.refreshClip()}catch(e){}}  // clipboard is shared on the server: the pane you tap shows "Paste here"
function duApply(){
  if(KID)return;
  const pref=LD('ls_dual','auto'),want=pref==='1'||(pref==='auto'&&innerWidth>=600&&innerHeight>=480);
  const w=$('#dual');
  if(want&&!DU){w.textContent='';
    const mk=n=>{const d=E('div','dw'+(n===1?' act':'')),f=document.createElement('iframe');f.src='/?pane='+n;f.title='Pane '+n;d.append(f);w.append(d);return[d,f]};
    const[wa,a]=mk(1),[wb,b]=mk(2);DU={a,b,wa,wb,act:1};document.body.classList.add('dual');window.lsDual=true}
  else if(!want&&DU){DU=null;window.lsDual=false;w.textContent='';document.body.classList.remove('dual')}}
async function lsXfer(from,op){
  if(!DU)return;
  const A=(from===1?DU.a:DU.b).contentWindow.lsPane,B=(from===1?DU.b:DU.a).contentWindow.lsPane;
  try{
    const paths=A.paths();if(!paths.length)return;
    if(A.dev===B.dev&&A.path===B.path){A.toast('Both panes show the same folder',3000);return}
    await A.api('POST','/api/clip',{op,dev:A.dev,paths});
    const r=await A.api('POST','/api/paste',{dev:B.dev,dir:B.path});
    A.clearSel();A.watchJob(r.job);
    if(await A.track(r.job)){await A.api('POST','/api/clip',{op:'clear'});A.dropClip()}
    A.load();B.load();B.refreshClip()}
  catch(e){A.toast('\u26a0 '+e.message,5000)}}
let duT=0;window.addEventListener('resize',()=>{clearTimeout(duT);duT=setTimeout(duApply,200)});
duApply();
