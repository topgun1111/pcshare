*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
svg{width:24px;height:24px;fill:currentColor;flex:none;display:block}
button,input,select,textarea{font-family:inherit;font-weight:inherit}
body{margin:0;font:500 15px/1.4 'Figtree LS',Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased;background:var(--bg);color:var(--fg);padding-bottom:calc(var(--dockh,0px) + 110px);overscroll-behavior-y:contain}
/* pull to refresh */
/* hidden items shown via "Show hidden files": faded */
.row.hdn>.lead,.row.hdn>.nm{opacity:.45}.vc.hdn{opacity:.5}
#ptr{position:fixed;left:0;right:0;top:0;height:0;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;z-index:6;font-size:13px;pointer-events:none}
#ptr div{margin:0 0 8px;padding:6px 14px;border-radius:16px;background:var(--cont);color:var(--mut);box-shadow:var(--sh)}#ptr.go div{color:var(--ac);font-weight:700}
.gptr{flex:none;height:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center;font-size:13px;pointer-events:none}
.gptr div{margin:0 0 8px;padding:6px 14px;border-radius:16px;background:var(--cont);color:var(--mut);box-shadow:var(--sh)}.gptr.go div{color:var(--ac);font-weight:700}
/* top app bar */
#top{position:sticky;top:0;z-index:5;background:var(--bg);transition:box-shadow .2s}
#top:before{content:"";display:block;height:env(safe-area-inset-top);background:var(--bar)}
#top.el{box-shadow:0 2px 6px #0004}
#pathrow{display:flex;align-items:center;gap:8px;padding:0 8px 0 4px;background:var(--card);border-bottom:1px solid var(--bd)}
.pill{cursor:pointer;display:none;align-items:center;gap:6px;flex:none;height:32px;padding:0 10px;border:1px solid var(--mut);border-radius:16px;font-weight:700;font-size:13px;letter-spacing:.2px;text-transform:uppercase}
.pill i{width:16px;height:16px;border-radius:50%;background:conic-gradient(var(--fg) var(--p,0%),var(--bd) 0)}
.bar{display:flex;align-items:center;gap:0;height:52px;padding:0 2px 0 14px;background:var(--bar);color:var(--onbar)}
.selb{display:none;padding-left:4px;background:var(--sel);color:var(--onsel)}
body.selm .mainb{display:none}body.selm .selb{display:flex}
.ttl{flex:1;min-width:0;display:flex;align-items:center;gap:10px}.bar .ibtn{width:48px;height:48px}.bar .ibtn svg{width:30px;height:30px}
.ttl h1{flex:0 1 auto;min-width:0;font-size:18px;line-height:24px;font-weight:600;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#nm{display:none!important;align-items:center;gap:4px;color:var(--barmut);font-size:12px;line-height:16px;flex:0 1 auto;min-width:0;max-width:50%}
#nm svg{width:12px;height:12px}#nmt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;transition:background .15s}
.ibtn:active,.ibtn.spin:active{background:var(--hov)}
.ibtn.spin svg{animation:rot .8s linear}
@keyframes rot{to{transform:rotate(360deg)}}
.selb h2{flex:1;font-size:20px;font-weight:600;margin:0 0 0 4px}
/* device chips */
#peers{display:none!important;gap:8px;overflow-x:auto;padding:5px 10px;scrollbar-width:none;background:var(--bg);border-bottom:1px solid var(--bd)}#peers::-webkit-scrollbar{display:none}
.chip{flex:none;height:28px;display:flex;align-items:center;gap:8px;border:1px solid var(--bd);background:var(--card);border-radius:14px;padding:0 12px 0 8px;font-size:13px;font-weight:600;transition:background .15s}
.chip:active{background:var(--hov)}
.chip svg{width:18px;height:18px}
.chip.on{background:var(--sel);color:var(--onsel);border-color:transparent}
.chip.add{color:var(--ac);border-style:dashed}
#peers{gap:8px;padding:6px 12px}
#peers .chip{height:38px;gap:8px;padding:0 15px 0 12px;border-radius:19px;font-size:14px;font-weight:600}
#peers .chip svg{width:20px;height:20px}
#peers .chip .dot{width:10px;height:10px;margin:0 3px}
#peers .chip small{font-size:11px}
/* narrow (folded) screen: the device chips shrink instead of running off the right edge */
#peers .chip.on{flex:0 1 auto;min-width:0}#peers .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:480px){#peers{gap:6px;padding:6px 8px}#peers .chip{padding:0 10px 0 8px;gap:6px;font-size:13px}#peers .chip.add{padding:0 8px}#peers .chip.add span{display:none}}

.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);margin:0 3px}.dot.wn{background:var(--warn)}
#hint{padding:3px 14px;color:var(--mut);font-size:12px;background:var(--bg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#hint:empty{display:none}
/* breadcrumbs */

function pePickPc(list){return new Promise(res=>{
  let last=null;try{last=JSON.parse(localStorage.getItem('ls_pepc')||'null')}catch(e){}
  const lp=last&&list.find(p=>p.name===last.name);
  if(list.length===1||lp)return res(lp||list[0]);
  const o=$('#sheet');o.textContent='';o.style.display='flex';const card=E('div','card');card.append(E('div','handle'),E('h3','','Open on which PC?'));
  const shut=pc=>{o.style.display='none';o.onclick=null;res(pc)};o.onclick=e=>{if(e.target===o)shut(null)};
  list.forEach(p=>{const r=E('button','set'),t=E('div','t');r.style.cssText='width:100%;text-align:left';t.append(E('b','',p.name));r.append(t);r.onclick=()=>shut(p);card.append(r)});o.append(card)})}
let PEBUSY=false;
async function peOpenOnPc(){
  const B=window.LSAndroid;if(!B||!B.peState||PEBUSY)return;PEBUSY=true;
  try{
    let st=JSON.parse(B.peState());
    if(!st.access){B.peGrant();toast('Allow “All files access”, then tap again',4500);return}
    if(!st.ip){toast('⚠ Connect to Wi-Fi first',3500);return}
    if(!st.run){toast('Starting…',1500);B.peStart();
      for(let i=0;i<20&&!st.run;i++){await new Promise(r=>setTimeout(r,300));st=JSON.parse(B.peState());if(st.err)break}
      if(!st.run){toast('⚠ '+(st.err||'Sharing did not start'),5000);return}}
    toast('Looking for your PC…',2000);
    const list=await api('GET','/api/pcfind',null,8000);
    if(!list||!list.length){toast('⚠ No PC found. Start phone_explorer.py on the PC (same Wi-Fi) and allow it in the Windows firewall',7000);return}
    const pc=await pePickPc(list);if(!pc)return;
    await api('POST','/api/pcphone?ip='+enc(pc.ip)+'&hport='+pc.port+'&port='+st.port+'&user='+enc(st.user)+'&pin='+enc(st.pin)+'&name='+enc(st.name||'Phone'),{},10000);
    try{localStorage.setItem('ls_pepc',JSON.stringify({name:pc.name}))}catch(e){}
    toast('Opened on '+pc.name,3000)
  }catch(e){toast('⚠ '+e.message,5000)}finally{PEBUSY=false}}
