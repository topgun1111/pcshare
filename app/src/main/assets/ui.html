#home .ht .tb svg{width:28px;height:28px;fill:currentColor}
#home .ht .tt{font-size:13px;font-weight:500;text-align:center;line-height:1.2}
#home .ht .ts{font-size:11px;color:var(--mut);text-align:center;line-height:1.2}

  if(!Array.isArray(ps))ps=null;

    const m=await dlg({title:'Find duplicates',msg:'Exact copies: byte-identical files (any file type, fast).\nSimilar images: the same picture in another size, quality or format (slower, pictures only).',ok:'Similar images',alt:'Exact copies'});
    if(!m)return;similar=m!=='alt'}

  const card=E('div','card');card.append(E('div','handle'),E('h3','',similar?'Similar images':'Duplicate finder'));

  const box=E('div');box.style.cssText='max-height:55vh;overflow-y:auto;overflow-x:hidden';

function pickAddFiles(){return new Promise(res=>{   // browse this phone, tick files / folders, "Add N"
  const o=$('#sheet');o.style.display='flex';let cur='/',tk=0;const pick=new Set();
  const fin=v=>{o.style.display='none';o.onclick=null;res(v)};o.onclick=e=>{if(e.target===o)fin(null)};
  const draw=async(p)=>{const my=++tk;let items=[],err='';
    try{const r=await api('GET','/api/ls?dev=local&path='+enc(p));if(my!==tk)return;p=r.path||p;items=(r.items||[]).filter(i=>S.hid||(i.name[0]!=='.'&&!i.hid)).sort((a,b)=>(b.dir-a.dir)||a.name.localeCompare(b.name))}catch(e){if(my!==tk)return;err=e.message}
    cur=p;o.textContent='';const card=E('div','card');card.append(E('div','handle'),E('h3','','Add to archive'));
    const loc=E('small','',p);loc.style.cssText='color:var(--mut);margin:-4px 0 6px;word-break:break-all';card.append(loc);
    if(p!=='/'){const b=E('button','li'),ld=E('div','lead'),lt=E('div','lt');ld.append(ic('back'));lt.append(E('span','','..'));b.append(ld,lt);b.onclick=()=>draw(pdir(p));card.append(b)}
    if(err)card.append(E('p','','\u26a0 '+err));else if(!items.length)card.append(E('p','','Empty folder.'));
    const ok=E('button','tbtn fill','Add');const upd=()=>{ok.textContent=pick.size?'Add '+pick.size+' item'+(pick.size>1?'s':''):'Add';ok.disabled=!pick.size;ok.style.opacity=pick.size?'1':'.5'};
    items.forEach(i=>{const fp=jn(p,i.name),b=E('button','li'),ld=E('div','lead'),lt=E('div','lt'),nm=E('span','',i.name);ld.append(ic(i.dir?'folder':'file'));lt.append(nm);b.append(ld,lt);
      const mark=()=>{b.style.background=pick.has(fp)?'rgba(33,150,243,.18)':'';nm.textContent=(pick.has(fp)?'\u2713 ':'')+i.name;upd()};
      if(i.dir){b.onclick=()=>draw(fp);const t=E('button','tbtn',pick.has(fp)?'\u2713':'Select');t.style.cssText='margin-left:auto;flex:none';t.onclick=e=>{e.stopPropagation();pick.has(fp)?pick.delete(fp):pick.add(fp);t.textContent=pick.has(fp)?'\u2713':'Select';mark()};b.append(t)}
      else b.onclick=()=>{pick.has(fp)?pick.delete(fp):pick.add(fp);mark()};
      card.append(b);mark()});
    const row=E('div','');row.style.cssText='display:flex;justify-content:flex-end;gap:8px;margin-top:8px;position:sticky;bottom:0;background:var(--cont);padding-top:4px';
    const c=E('button','tbtn','Cancel');c.onclick=()=>fin(null);ok.onclick=()=>{if(pick.size)fin([...pick])};row.append(c,ok);card.append(row);o.append(card);upd()};
  draw(cur)})}
async function doAddToZip(){
  if(!zipEd())return;const ps=await pickAddFiles();if(!ps||!ps.length)return;
  const cf=await askConflicts(S.dev,S.path,ps,'local');if(!cf)return;

$('#fab').onclick=()=>inArc()?(zipEd()?doZipMenu():doExtract(2)):doNew();

$('#allsel').onclick=()=>{const a=shown().map(i=>i.name);S.sel=(a.length&&S.sel.size>=a.length&&a.every(n=>S.sel.has(n)))?new Set():new Set(a);render()};   // second tap with everything selected = unselect all
$('#scan').onclick=async()=>{const b=$('#scan');b.classList.remove('spin');void b.offsetWidth;b.classList.add('spin');

$('#nm').onclick=async()=>{const n=await dlg({title:'Device name',msg:'How this device appears to others',input:{value:$('#nm').dataset.n||'',label:'Name'},ok:'Save'});if(!n)return;

/* ---- split screen: two full, independent panes (each can show this phone or another device); copy/move between them ---- */
window.lsPane={get dev(){return S.dev},get path(){return S.path},paths:()=>selPaths(),
  clearSel(){S.sel.clear();render()},api,toast,watchJob,track,load,refreshClip,
  dropClip(){S.clip=null;renderBar()},
  askConflicts:(...a)=>askConflicts(...a),
  rowAt(x,y,own){const e=document.elementFromPoint(x,y),w=e&&e.closest&&e.closest('.row'),it=w&&w._it;   // folder row under a point (not one of the dragged rows)
    return it&&it.dir&&!(own&&S.sel.has(it.name))?{name:it.name,el:w}:null},
  hot(el){if(this._h&&this._h!==el)this._h.classList.remove('dnt');this._h=el||null;if(el)el.classList.add('dnt')}};
if(KID){document.body.classList.add('kid');$('#dualb').textContent='';$('#dualb').append(ic('single'));
  document.addEventListener('pointerdown',()=>{try{parent.lsFocus(PN)}catch(e){}},true);
  $('#dualb').onclick=()=>{try{parent.lsDualSet(false)}catch(e){}}}
else $('#dualb').onclick=()=>lsDualSet(true);
function lsDualSet(on){SV('ls_dual',on?'1':'0');duApply()}
function lsFocus(n){if(!DU||DU.act===n)return;DU.act=n;DU.wa.classList.toggle('act',n===1);DU.wb.classList.toggle('act',n===2);
  try{(n===1?DU.a:DU.b).contentWindow.lsPane.refreshClip()}catch(e){}}  // clipboard is shared on the server: the pane you tap shows "Paste here"
function duApply(){
  if(KID)return;
  const pref=LD('ls_dual','auto'),fits=innerWidth>=600&&innerHeight>=480,want=fits&&pref!=='0';   // forced split ('1') also drops out when the window shrinks below the split size (fold closed -> phone mode); it comes back on unfold
  const w=$('#dual');

    const mk=n=>{const d=E('div','dw'+(n===1?' act':'')),f=document.createElement('iframe');f.src='/?pane='+n;f.title='Pane '+n;d.append(f);w.append(d);return[d,f]};
    const[wa,a]=mk(1),[wb,b]=mk(2);DU={a,b,wa,wb,act:1};document.body.classList.add('dual');window.lsDual=true}
  else if(!want&&DU){DU=null;window.lsDual=false;w.textContent='';document.body.classList.remove('dual')}}
/* copy / move the selection of pane `from` into pane `to` (or into folder `dir` of it) */
async function lsDrop(from,to,op,dir){
  if(!DU)return;
  const A=(from===1?DU.a:DU.b).contentWindow.lsPane,B=(to===1?DU.a:DU.b).contentWindow.lsPane;
  const dd=dir==null?B.path:dir;
  try{
    const paths=A.paths();if(!paths.length)return;
    if(A.dev===B.dev&&A.path===dd){A.toast(dir==null?'Both panes show the same folder':'Already in this folder',3000);return}
    if(A.dev===B.dev&&paths.some(p=>dd===p||dd.startsWith(p+'/'))){A.toast('A folder cannot go into itself',3000);return}
    A.toast(op==='cut'?'Moving\u2026':'Copying\u2026',1500);   // instant feedback: the button never looks dead
    await A.api('POST','/api/clip',{op,dev:A.dev,paths});
    // no pre-check over the network: the job itself asks "replace / skip (all)?" per file when a name already exists (nothing is ever deleted unasked)
    const r=await A.api('POST','/api/paste',{dev:B.dev,dir:dd,conflict:'ask'});
    A.clearSel();A.watchJob(r.job);
    if(await A.track(r.job)){await A.api('POST','/api/clip',{op:'clear'});A.dropClip()}
    A.load();B.load();B.refreshClip()}
  catch(e){A.toast('\u26a0 '+e.message,5000)}}
function lsXfer(from,op){return lsDrop(from,from===1?2:1,op)}
/* ---- drag & drop between the panes (parent side): ghost, drop highlight, edge auto-scroll, Copy / Move chooser ---- */
const DND={on:0,from:0,g:null,tp:0,tr:null,px:0,py:0,raf:0,what:''};
const dndFr=n=>DU&&(n===1?DU.a:DU.b);
function dndPlace(){
  if(!DU||!DND.g)return;
  DND.g.style.transform='translate('+(DND.px+14)+'px,'+(DND.py-18)+'px)';
  let tp=0,row=null;
  for(const n of [1,2]){const fr=dndFr(n),r=fr.getBoundingClientRect();
    if(DND.px>=r.left&&DND.px<r.right&&DND.py>=r.top&&DND.py<r.bottom){tp=n;
      try{row=fr.contentWindow.lsPane.rowAt(DND.px-r.left,DND.py-r.top,n===DND.from)}catch(e){}}}
  DND.tp=tp;DND.tr=row;
  DU.wa.classList.toggle('drop',tp===1&&!row&&!(DND.from===1));DU.wb.classList.toggle('drop',tp===2&&!row&&!(DND.from===2));
  [1,2].forEach(n=>{try{dndFr(n).contentWindow.lsPane.hot(n===tp&&row?row.el:null)}catch(e){}})}
function dndTick(){
  if(!DND.on)return;
  if(DND.tp){const fr=dndFr(DND.tp),r=fr.getBoundingClientRect(),y=DND.py-r.top,h=r.height,z=70;let dy=0;
    if(y<z)dy=-Math.ceil((z-y)/5);else if(y>h-z)dy=Math.ceil((y-(h-z))/5);
    if(dy){try{fr.contentWindow.scrollBy(0,Math.max(-24,Math.min(24,dy)));dndPlace()}catch(e){}}}
  DND.raf=requestAnimationFrame(dndTick)}
function dndStop(){
  DND.on=0;cancelAnimationFrame(DND.raf);if(DND.g){DND.g.remove();DND.g=null}
  document.body.classList.remove('dnd');
  if(DU){DU.wa.classList.remove('drop');DU.wb.classList.remove('drop');
    [1,2].forEach(n=>{try{dndFr(n).contentWindow.lsPane.hot(null)}catch(e){}})}}
function dndAsk(x,y,what,where){return new Promise(res=>{
  const sc=E('div','dsc'),m=E('div','dmn');
  const done=v=>{sc.remove();res(v)};
  m.append(E('div','dmh',what+' \u2192 '+where));
  const b=(t,v,c)=>{const e=E('button','dmb'+(c||''),t);e.onclick=()=>done(v);return e};
  m.append(b('Copy here','copy',' pri'),b('Move here','cut'),b('Cancel',null));
  sc.onclick=e=>{if(e.target===sc)done(null)};
  sc.append(m);document.body.append(sc);
  const mw=m.offsetWidth,mh=m.offsetHeight;
  m.style.left=Math.max(8,Math.min(x-mw/2,innerWidth-mw-8))+'px';
  m.style.top=Math.max(8,Math.min(y-mh-12,innerHeight-mh-8))+'px'})}
window.lsDnd={
  begin(pn,what){if(!DU)return;dndStop();DND.on=1;DND.from=pn;DND.what=what;DND.tp=0;DND.tr=null;
    const g=E('div','dgh',what);document.body.append(g);DND.g=g;document.body.classList.add('dnd');
    DND.raf=requestAnimationFrame(dndTick)},
  move(pn,x,y){if(!DND.on||!DU)return;const f=dndFr(pn).getBoundingClientRect();DND.px=f.left+x;DND.py=f.top+y;dndPlace()},
  cancel(){dndStop()},
  async end(pn,x,y,ev){
    if(!DND.on||!DU)return;
    if(x||y){const f=dndFr(pn).getBoundingClientRect();DND.px=f.left+x;DND.py=f.top+y;dndPlace()}
    const tp=DND.tp,row=DND.tr,from=DND.from,what=DND.what,px=DND.px,py=DND.py;dndStop();
    if(!tp||(tp===from&&!row))return;                      // dropped outside, or on the empty area of its own pane: nothing to do
    const B=dndFr(tp).contentWindow.lsPane,A=dndFr(from).contentWindow.lsPane;
    const dir=row?jn(B.path,row.name):null;
    const leaf=p=>p.split('/').filter(Boolean).pop()||'/';
    const where=(B.dev!==A.dev?devName(B.dev)+' / ':'')+(row?row.name.replace(/!$/,''):leaf(B.path));
    const op=(ev&&ev.ctrlKey)?'copy':(ev&&ev.shiftKey)?'cut':await dndAsk(px,py,what,where);   // mouse: Ctrl = copy, Shift = move, no key = ask
    if(op)lsDrop(from,tp,op,dir)}};
